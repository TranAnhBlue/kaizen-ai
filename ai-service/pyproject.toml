[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kaizen-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3", "numpy>=2,<3", "pypdf>=5,<7", "python-docx>=1.1,<2", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
