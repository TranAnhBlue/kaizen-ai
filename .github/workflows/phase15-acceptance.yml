name: Phase 15 acceptance tooling
on:
  push:
    paths:
      - 'scripts/phase15_e2e.py'
      - 'scripts/tests/test_phase15_e2e.py'
      - '.github/workflows/phase15-acceptance.yml'
  pull_request:
  workflow_dispatch:
jobs:
  acceptance-tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test acceptance runner without live services
        run: python -m unittest discover -s scripts/tests -p 'test_phase15_e2e.py' -v
      - name: Compile acceptance runner
        run: python -m py_compile scripts/phase15_e2e.py
