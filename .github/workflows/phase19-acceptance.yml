name: Phase 19 acceptance tool tests
on:
  push:
  pull_request:
jobs:
  acceptance-tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -p test_phase19_acceptance.py -v
      - name: Syntax validation
        run: python -m py_compile scripts/phase19_acceptance.py
