name: Integration smoke tests
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kaizen
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: kaizen_ai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaizen -d kaizen_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kaizen:integration-only-password@localhost:5432/kaizen_ai
      JWT_SECRET: ci-only-long-jwt-secret-please-change-in-production
      AI_SERVICE_TOKEN: ci-only-long-internal-token-not-for-production
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: backend
      - run: npx prisma generate && npx prisma migrate deploy && npm run build
        working-directory: backend
      - run: |
          npm run start > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/api/v1/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
        working-directory: backend
